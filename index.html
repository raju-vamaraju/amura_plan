<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amura Meal Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F5F0;
  --surface: #FFFFFF;
  --surface2: #F0EDE6;
  --green: #1C4034;
  --green-mid: #2D6A4F;
  --green-light: #E8F3EE;
  --green-text: #1A5C3A;
  --terra: #C05A36;
  --terra-light: #FAF0EB;
  --terra-text: #9B3A1E;
  --amber: #B8741A;
  --amber-light: #FEF3E2;
  --amber-text: #8A500F;
  --blue: #1E5F8E;
  --blue-light: #E8F4FF;
  --muted: #6B7260;
  --hint: #9B9E8F;
  --border: #DDD9CF;
  --border-light: #EDEBE4;
  --text: #1E1F1A;
  --radius: 12px;
  --radius-sm: 8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.6;}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;}

/* Header */
.site-header{background:var(--green);color:#fff;padding:1.1rem 1.25rem 1rem;position:sticky;top:0;z-index:100;}
.header-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:.75rem;}
.logo-dot{width:34px;height:34px;border-radius:50%;background:var(--terra);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-dot svg{width:18px;height:18px;fill:#fff;}
.header-title{font-family:'Playfair Display',Georgia,serif;font-size:1.15rem;color:#fff;font-weight:600;line-height:1.2;}
.header-sub{font-size:.7rem;color:rgba(255,255,255,.6);font-weight:300;letter-spacing:.3px;}

/* Tab nav */
.tab-nav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:62px;z-index:99;}
.tab-nav-inner{max-width:900px;margin:0 auto;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tab-nav-inner::-webkit-scrollbar{display:none;}
.tab-btn{padding:.7rem 1.1rem;font-size:.8rem;font-weight:500;font-family:'Outfit',sans-serif;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;letter-spacing:.2px;}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green);font-weight:600;}

/* Main */
main{max-width:900px;margin:0 auto;padding:1.25rem;}

/* Panes */
.pane{display:none;animation:fadeIn .2s ease;}
.pane.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* Week navigation */
.week-nav{display:flex;align-items:center;justify-content:space-between;background:var(--green);border-radius:var(--radius);padding:.7rem 1rem;margin-bottom:1.1rem;}
.week-nav-btn{background:rgba(255,255,255,.15);border:none;cursor:pointer;width:32px;height:32px;border-radius:50%;color:#fff;font-size:1.1rem;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;}
.week-nav-btn:hover:not(:disabled){background:rgba(255,255,255,.25);}
.week-nav-btn:disabled{opacity:.35;cursor:default;}
.week-info{text-align:center;flex:1;padding:0 .5rem;}
.week-info-label{font-size:.68rem;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.5px;margin-bottom:1px;}
.week-info-dates{font-size:.9rem;font-weight:500;color:#fff;}
.week-badge{font-size:.6rem;font-weight:600;background:var(--terra);color:#fff;padding:2px 6px;border-radius:3px;margin-left:5px;vertical-align:middle;}
.rotation-label{font-size:.62rem;color:rgba(255,255,255,.5);margin-top:2px;}
/* Week overview — all days */
.week-all-days{display:flex;flex-direction:column;gap:1.5rem;}
.day-block{padding-bottom:1.25rem;border-bottom:2px dashed var(--border);}
.day-block:last-child{border-bottom:none;padding-bottom:0;}
.day-date{font-size:.72rem;color:var(--hint);margin-left:.35rem;}

/* Day cards */
.day-header{display:flex;align-items:baseline;gap:.5rem;margin-bottom:.85rem;}
.day-heading{font-size:1.35rem;color:var(--green);}
.day-kcal{font-size:.75rem;color:var(--muted);background:var(--surface2);padding:2px 8px;border-radius:20px;}

.meal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:.85rem;}
.meal-time-bar{padding:.45rem .9rem;display:flex;align-items:center;gap:.5rem;font-size:.7rem;font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
.meal-time-bar.noon{background:var(--green-light);color:var(--green-text);}
.meal-time-bar.fourpm{background:var(--amber-light);color:var(--amber-text);}
.meal-time-bar svg{width:13px;height:13px;}
.meal-body{padding:.85rem .9rem;}
.meal-name{font-family:'Playfair Display',Georgia,serif;font-size:1.05rem;color:var(--text);margin-bottom:.2rem;}
.meal-benefit{font-size:.73rem;color:var(--muted);margin-bottom:.55rem;}
.macro-row{display:flex;gap:.5rem;flex-wrap:wrap;}
.macro-pill{font-size:.68rem;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--muted);font-weight:500;}
.macro-pill.kcal{background:var(--green-light);color:var(--green-text);}
.meal-toggle{width:100%;padding:.55rem .9rem;background:none;border:none;border-top:1px solid var(--border-light);text-align:left;font-size:.72rem;color:var(--green-mid);cursor:pointer;font-family:'Outfit',sans-serif;display:flex;align-items:center;gap:.3rem;}
.meal-toggle svg{transition:transform .2s;flex-shrink:0;}
.meal-toggle.open svg{transform:rotate(180deg);}
.recipe-expand{display:none;padding:.7rem .9rem;border-top:1px solid var(--border-light);background:var(--bg);}
.recipe-expand.open{display:block;}
.expand-section{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--hint);margin:.5rem 0 .25rem;}
.expand-text{font-size:.8rem;color:var(--muted);line-height:1.6;}
.ing-table{width:100%;font-size:.78rem;border-collapse:collapse;}
.ing-table td{padding:3px 0;border-bottom:1px solid var(--border-light);color:var(--muted);}
.ing-table td:last-child{text-align:right;color:var(--text);font-weight:500;}
.ing-table tr:last-child td{border-bottom:none;}

/* Shopping list */
.shop-intro{font-size:.82rem;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.85rem 1rem;margin-bottom:1.1rem;line-height:1.6;}
.shop-section{margin-bottom:1.1rem;}
.shop-section-title{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--hint);margin-bottom:.5rem;padding-left:.1rem;}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
@media(min-width:520px){.shop-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:700px){.shop-grid{grid-template-columns:repeat(4,1fr);}}
.shop-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.55rem .7rem;display:flex;align-items:flex-start;gap:.4rem;cursor:pointer;transition:border-color .15s;}
.shop-item.checked{border-color:var(--green);background:var(--green-light);}
.shop-item:hover{border-color:var(--border);}
.shop-cb{width:14px;height:14px;border:1.5px solid var(--border);border-radius:3px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.shop-item.checked .shop-cb{background:var(--green);border-color:var(--green);}
.shop-cb svg{width:9px;height:9px;fill:#fff;display:none;}
.shop-item.checked .shop-cb svg{display:block;}
.shop-text{flex:1;}
.shop-name{font-size:.78rem;color:var(--text);line-height:1.3;}
.shop-qty{font-size:.67rem;color:var(--muted);}
.shop-progress{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.7rem 1rem;margin-bottom:1rem;display:flex;align-items:center;gap:.75rem;}
.progress-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:var(--green);border-radius:3px;transition:width .3s ease;}
.progress-label{font-size:.75rem;color:var(--muted);white-space:nowrap;}
.reset-btn{font-size:.7rem;color:var(--terra);background:none;border:none;cursor:pointer;font-family:'Outfit',sans-serif;padding:2px 6px;}

/* Prep guide */
.prep-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:.85rem;}
.prep-header{padding:.7rem 1rem;background:var(--green);color:#fff;display:flex;align-items:center;gap:.5rem;}
.prep-icon{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.prep-icon svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.prep-title{font-size:.85rem;font-weight:500;line-height:1.2;}
.prep-time{font-size:.68rem;color:rgba(255,255,255,.65);margin-top:1px;}
.prep-items{padding:.5rem 0;}
.prep-item{padding:.55rem 1rem;border-bottom:1px solid var(--border-light);display:flex;gap:.6rem;align-items:flex-start;}
.prep-item:last-child{border-bottom:none;}
.prep-tag{font-size:.62rem;font-weight:600;padding:2px 6px;border-radius:3px;white-space:nowrap;margin-top:1px;flex-shrink:0;}
.tag-batch{background:var(--green-light);color:var(--green-text);}
.tag-chop{background:var(--amber-light);color:var(--amber-text);}
.tag-ready{background:var(--blue-light);color:var(--blue);}
.tag-marinate{background:var(--terra-light);color:var(--terra-text);}
.tag-blend{background:#EEF2FE;color:#3245B0;}
.tag-bake{background:#F3F0FF;color:#5B21B6;}
.tag-grind{background:#F0FFF4;color:#166534;}
.prep-item-text{font-size:.8rem;color:var(--muted);line-height:1.55;}

/* Recipe search */
.search-wrap{position:relative;margin-bottom:.9rem;}
.search-wrap svg{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--hint);fill:none;stroke-width:2;pointer-events:none;}
.search-input{width:100%;padding:.65rem .9rem .65rem 2.5rem;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.88rem;font-family:'Outfit',sans-serif;background:var(--surface);color:var(--text);transition:border-color .15s;}
.search-input:focus{outline:none;border-color:var(--green);}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.9rem;}
.filter-chip{font-size:.72rem;font-weight:500;padding:.28rem .7rem;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s;font-family:'Outfit',sans-serif;}
.filter-chip.active{background:var(--green);border-color:var(--green);color:#fff;}
.results-count{font-size:.72rem;color:var(--hint);margin-bottom:.7rem;}
.recipe-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(min-width:520px){.recipe-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:700px){.recipe-grid{grid-template-columns:repeat(4,1fr);}}
.recipe-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem;cursor:pointer;transition:all .15s;}
.recipe-card:hover{border-color:var(--green-mid);transform:translateY(-1px);}
.recipe-cat{font-size:.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding:2px 6px;border-radius:3px;display:inline-block;margin-bottom:.35rem;}
.cat-v{background:var(--green-light);color:var(--green-text);}
.cat-s{background:var(--blue-light);color:var(--blue);}
.cat-so{background:var(--amber-light);color:var(--amber-text);}
.cat-d{background:var(--surface2);color:var(--muted);}
.cat-c{background:var(--terra-light);color:var(--terra-text);}
.recipe-title{font-family:'Playfair Display',Georgia,serif;font-size:.88rem;color:var(--text);line-height:1.3;margin-bottom:.25rem;}
.recipe-benefit{font-size:.67rem;color:var(--hint);margin-bottom:.4rem;line-height:1.3;}
.recipe-kcal{font-size:.72rem;font-weight:600;color:var(--green-text);background:var(--green-light);padding:1px 6px;border-radius:3px;display:inline-block;}
.no-results{text-align:center;padding:2.5rem 1rem;color:var(--muted);font-size:.88rem;}

/* Recipe detail */
.detail-view{display:none;}
.detail-view.active{display:block;}
.recipe-list-view{display:block;}
.recipe-list-view.hidden{display:none;}
.back-btn{display:flex;align-items:center;gap:.35rem;background:none;border:none;cursor:pointer;font-size:.8rem;color:var(--green);font-family:'Outfit',sans-serif;margin-bottom:1rem;padding:0;}
.back-btn svg{width:16px;height:16px;stroke:var(--green);fill:none;stroke-width:2;}
.detail-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.detail-hero{background:var(--green);padding:1.25rem 1.1rem;}
.detail-cat{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.6);margin-bottom:.3rem;}
.detail-name{font-family:'Playfair Display',Georgia,serif;font-size:1.4rem;color:#fff;margin-bottom:.25rem;}
.detail-benefit{font-size:.8rem;color:rgba(255,255,255,.75);}
.macro-strip{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border);}
.macro-cell{padding:.65rem .5rem;text-align:center;border-right:1px solid var(--border);}
.macro-cell:last-child{border-right:none;}
.macro-val{font-size:1rem;font-weight:600;color:var(--text);}
.macro-lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.3px;color:var(--hint);margin-top:1px;}
.detail-section{padding:.75rem 1rem;border-bottom:1px solid var(--border-light);}
.detail-section:last-child{border-bottom:none;}
.detail-section-title{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--hint);margin-bottom:.5rem;}
.detail-method{font-size:.85rem;color:var(--muted);line-height:1.7;}

/* Toast / utility */


@media(max-width:420px){
  main{padding:.9rem .85rem;}
  .day-heading{font-size:1.15rem;}
  .recipe-grid{grid-template-columns:1fr 1fr;}
  .shop-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo-dot">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 4a3 3 0 110 6 3 3 0 010-6zm0 14a8 8 0 01-6.28-3.03A4.98 4.98 0 0110 15h4a4.98 4.98 0 014.28 2.37A8 8 0 0112 20z"/></svg>
    </div>
    <div>
      <div class="header-title">Amura Meal Planner</div>
      <div class="header-sub">12 pm &amp; 4 pm vegetarian guide</div>
    </div>
  </div>
</header>

<nav class="tab-nav">
  <div class="tab-nav-inner">
    <button class="tab-btn active" onclick="switchTab('plan',this)">Weekly plan</button>
    <button class="tab-btn" onclick="switchTab('shop',this)">Shopping list</button>
    <button class="tab-btn" onclick="switchTab('prep',this)">Prep guide</button>
    <button class="tab-btn" onclick="switchTab('recipes',this)">Recipe finder</button>
  </div>
</nav>

<main>

<!-- WEEKLY PLAN -->
<div id="pane-plan" class="pane active">
  <div id="weekNav"></div>
  <div class="week-all-days" id="allDaysContent"></div>
</div>

<!-- SHOPPING LIST -->
<div id="pane-shop" class="pane">
  <div class="shop-intro">
    Buy everything below in one weekend shop — it covers all 7 days of your 12 pm &amp; 4 pm meals. Tap items to tick them off as you shop.
  </div>
  <div class="shop-progress">
    <div class="progress-bar"><div class="progress-fill" id="shopProgress" style="width:0%"></div></div>
    <div class="progress-label" id="shopLabel">0 / 0 items</div>
    <button class="reset-btn" onclick="resetShop()">Reset</button>
  </div>
  <div id="shopContent"></div>
</div>

<!-- PREP GUIDE -->
<div id="pane-prep" class="pane">
  <div id="prepContent"></div>
</div>

<!-- RECIPE FINDER -->
<div id="pane-recipes" class="pane">
  <div class="recipe-list-view" id="recipeListView">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" type="text" id="searchQ" placeholder="Search by name, ingredient or benefit…" oninput="renderRecipeList()">
    </div>
    <div class="filter-row" id="filterRow"></div>
    <div class="results-count" id="resultsCount"></div>
    <div class="recipe-grid" id="recipeGrid"></div>
  </div>
  <div class="detail-view" id="detailView">
    <button class="back-btn" onclick="closeDetail()">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Back to recipes
    </button>
    <div id="detailContent"></div>
  </div>
</div>

</main>

const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

const PLAN = [
  {noon:{name:'Gajar Sabji',kcal:164,carb:'27g',prot:'3g',fat:'6g',benefit:'High in fiber & Vit A',

  {noon:{name:'Spinach Caulirice',kcal:89,carb:'9g',prot:'3g',fat:'6g',benefit:'Rich in fiber & iron',
    ing:[['Cauliflower grated & steamed','1 cup'],['Spinach','1 cup'],['Ginger minced','1 tsp'],['Garlic minced','1 tsp'],['Garam masala','½ tsp'],['Shahi jeera','1 tsp'],['Lemon juice','1 tsp'],['Ghee','1 tsp'],['Salt and pepper','to taste']],

   pm4:{name:'Beetroot Salad',kcal:124,carb:'25g',prot:'5g',fat:'1g',benefit:'Rich in iron, boosts stamina',

  {noon:{name:'Broccoli Sabji',kcal:121,carb:'17g',prot:'4g',fat:'5g',benefit:'Rich in Vit K & potassium',

    method:'Melt butter, add ginger garlic paste and sauté onion. Then add cumin powder, coriander powder and garam masala. Add broccoli. Sauté for few minutes and close the lid. Cook for 20 minutes. Enjoy.'},

function getR(name) { return RECIPES.find(r=>r.name===name); }

function getISOWeek(d) {
  const date = new Date(d); date.setHours(0,0,0,0);
  date.setDate(date.getDate()+3-(date.getDay()+6)%7);
  const w1 = new Date(date.getFullYear(),0,4);
  return 1+Math.round(((date-w1)/86400000-3+(w1.getDay()+6)%7)/7);
}

function getMondayOf(offset) {
  const today = new Date();
  const day = today.getDay();
  const diff = day===0 ? -6 : 1-day;
  const m = new Date(today); m.setDate(today.getDate()+diff+offset*7); m.setHours(0,0,0,0);
  return m;
}

function fmtDate(d) { return d.toLocaleDateString('en-AU',{day:'numeric',month:'short'}); }

let weekOffset = 0;

let checkedItems = JSON.parse(localStorage.getItem('amura_shop')||'{}');
let activeRecipeCat = 'All';
let openDetail = null;

function switchTab(id, btn) {
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('pane-'+id).classList.add('active');
  btn.classList.add('active');
}

function renderWeekNav() {
  const monday = getMondayOf(weekOffset);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const rot = ['A','B','C','D'][getISOWeek(monday)%4];
  const isNow = weekOffset===0;
  const label = isNow ? 'This week' : weekOffset===1 ? 'Next week' : weekOffset===-1 ? 'Last week' : weekOffset>0 ? `${weekOffset} weeks ahead` : `${Math.abs(weekOffset)} weeks back`;
  document.getElementById('weekNav').innerHTML = `
    <div class="week-nav">
      <button class="week-nav-btn" onclick="changeWeek(-1)" ${weekOffset<=-2?'disabled':''} aria-label="Previous week">&#8592;</button>
      <div class="week-info">
        <div class="week-info-label">${label}</div>
        <div class="week-info-dates">${fmtDate(monday)} – ${fmtDate(sunday)}${isNow?'<span class="week-badge">Current</span>':''}</div>
        <div class="rotation-label">Menu rotation ${rot}</div>
      </div>
      <button class="week-nav-btn" onclick="changeWeek(1)" ${weekOffset>=4?'disabled':''} aria-label="Next week">&#8594;</button>
    </div>`;
}

function changeWeek(dir) {
  weekOffset += dir;
  renderAllDays();
}

function renderAllDays() {
  renderWeekNav();
  const monday = getMondayOf(weekOffset);
  const rotation = getISOWeek(monday) % 4;
  const plan = PLAN_REFS[rotation];
  const today = new Date(); today.setHours(0,0,0,0);

  const el = document.getElementById('allDaysContent');
  el.innerHTML = DAYS.map((day, i) => {
    const refs = plan[i];
    const noon = getR(refs.noon);
    const pm4  = getR(refs.pm4);
    if (!noon || !pm4) return '';
    const date = new Date(monday); date.setDate(monday.getDate()+i);
    const isToday = date.getTime()===today.getTime();
    const total = noon.kcal + pm4.kcal;
    return `
      <div class="day-block" id="day-block-${i}">
        <div class="day-header" ${isToday?'style="border-left:3px solid var(--green);padding-left:.6rem;margin-left:-.6rem;"':''}>
          <h2 class="day-heading">${day}${isToday?' <span style="font-size:.6rem;font-weight:400;background:var(--green);color:#fff;padding:2px 6px;border-radius:3px;vertical-align:middle;font-family:Outfit,sans-serif">Today</span>':''}</h2>
          <span class="day-date">${fmtDate(date)}</span>
          <span class="day-kcal">${total} kcal</span>
        </div>
        ${mealCardHTML('noon','12 pm lunch',noon,i)}
        ${mealCardHTML('fourpm','4 pm snack',pm4,i)}
      </div>`;
  }).join('');
}

function mealCardHTML(type, label, meal, dayIdx) {
  const ingRows = meal.ing.map(([n,q])=>`<tr><td>${n}</td><td>${q}</td></tr>`).join('');
  return `
    <div class="meal-card">
      <div class="meal-time-bar ${type}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        ${label}
      </div>
      <div class="meal-body">
        <div class="meal-name">${meal.name}</div>
        <div class="meal-benefit">${meal.benefit}</div>
        <div class="macro-row">
          <span class="macro-pill kcal">${meal.kcal} kcal</span>
          <span class="macro-pill">Carbs ${meal.carb}</span>
          <span class="macro-pill">Protein ${meal.prot}</span>
          <span class="macro-pill">Fat ${meal.fat}</span>
        </div>
      </div>
      <button class="meal-toggle" id="toggle-${type}-${dayIdx}" onclick="toggleMeal('${type}',${dayIdx})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M6 9l6 6 6-6"/></svg>
        Show recipe
      </button>
      <div class="recipe-expand" id="expand-${type}-${dayIdx}">
        <div class="expand-section">Ingredients</div>
        <table class="ing-table"><tbody>${ingRows}</tbody></table>
        <div class="expand-section" style="margin-top:.6rem">Method</div>
        <div class="expand-text">${meal.method}</div>
      </div>
    </div>`;
}

function toggleMeal(type, day) {
  const exp = document.getElementById(`expand-${type}-${day}`);
  const btn = document.getElementById(`toggle-${type}-${day}`);
  const isOpen = exp.classList.contains('open');
  exp.classList.toggle('open', !isOpen);
  btn.classList.toggle('open', !isOpen);
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M6 9l6 6 6-6"/></svg> ${isOpen ? 'Show recipe' : 'Hide recipe'}`;
}

function renderShop() {
  const el = document.getElementById('shopContent');
  let total = 0, checked = 0;
  SHOPPING.forEach(s=>s.items.forEach(()=>total++));
  Object.keys(checkedItems).forEach(k=>{ if(checkedItems[k]) checked++; });
  const pct = total ? Math.round(checked/total*100) : 0;
  document.getElementById('shopProgress').style.width = pct+'%';
  document.getElementById('shopLabel').textContent = `${checked} / ${total} items`;

  el.innerHTML = SHOPPING.map(s=>`
    <div class="shop-section">
      <div class="shop-section-title">${s.section}</div>
      <div class="shop-grid">
        ${s.items.map(item=>{
          const key = s.section+'|'+item.name;
          const on = checkedItems[key];
          return `<div class="shop-item ${on?'checked':''}" onclick="toggleShop('${key}',this)">
            <div class="shop-cb"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="white" stroke-width="1.5" fill="none"/></svg></div>
            <div class="shop-text">
              <div class="shop-name">${item.name}</div>
              <div class="shop-qty">${item.qty}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`).join('');
}

function toggleShop(key, el) {
  checkedItems[key] = !checkedItems[key];
  localStorage.setItem('amura_shop', JSON.stringify(checkedItems));
  renderShop();
}

function resetShop() {
  checkedItems = {};
  localStorage.setItem('amura_shop', JSON.stringify(checkedItems));
  renderShop();
}

function renderPrep() {
  const tagMap = {batch:'batch',chop:'chop',ready:'ready',marinate:'marinate',blend:'blend',bake:'bake',grind:'grind'};
  const el = document.getElementById('prepContent');
  el.innerHTML = `<p style="font-size:.82rem;color:var(--muted);margin-bottom:1rem;line-height:1.6;">Each morning takes just 5–10 min. The Sunday bulk prep session is the key to managing the whole week hands-free.</p>` +
  PREP.map(p=>`
    <div class="prep-card">
      <div class="prep-header">
        <div class="prep-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        </div>
        <div>
          <div class="prep-title">${p.title}</div>
          <div class="prep-time">${p.time}</div>

        ${p.items.map(item=>`

            <span class="prep-item-text">${item.text}</span>
          </div>`).join('')}
      </div>
    </div>`).join('');

function catClass(cat) {
  return {Vegetarian:'cat-v',Salad:'cat-s',Soup:'cat-so',Drink:'cat-d',Chutney:'cat-c'}[cat]||'cat-d';
}

function renderFilterRow() {
  const cats = ['All','Vegetarian','Salad','Soup','Drink','Chutney'];
  document.getElementById('filterRow').innerHTML = cats.map(c=>`
    <button class="filter-chip ${activeRecipeCat===c?'active':''}" onclick="setRecipeCat('${c}')">${c}</button>`).join('');
}

function setRecipeCat(cat) {
  activeRecipeCat = cat;
  renderFilterRow();
  renderRecipeList();
}

function renderRecipeList() {
  const q = (document.getElementById('searchQ')||{}).value||'';
  const ql = q.toLowerCase();
  const results = RECIPES.filter(r=>{
    const catOk = activeRecipeCat==='All'||r.cat===activeRecipeCat;
    const qOk = !ql||r.name.toLowerCase().includes(ql)||r.benefit.toLowerCase().includes(ql)||r.ing.map(i=>i[0]).join(' ').toLowerCase().includes(ql);
    return catOk && qOk;
  });
  document.getElementById('resultsCount').textContent = `${results.length} recipe${results.length!==1?'s':''} found`;
  const grid = document.getElementById('recipeGrid');
  if(!results.length){
    grid.innerHTML = '<div class="no-results">No recipes found. Try a different search or filter.</div>';
    return;
  }
  grid.innerHTML = results.map(r=>{
    const idx = RECIPES.indexOf(r);
    return `<div class="recipe-card" onclick="showDetail(${idx})">
      <span class="recipe-cat ${catClass(r.cat)}">${r.cat}</span>
      <div class="recipe-title">${r.name}</div>
      <div class="recipe-benefit">${r.benefit}</div>
      <span class="recipe-kcal">${r.kcal} kcal</span>
    </div>`;
  }).join('');
}

function showDetail(idx) {
  openDetail = idx;
  const r = RECIPES[idx];
  document.getElementById('recipeListView').classList.add('hidden');
  document.getElementById('detailView').classList.add('active');
  const ingRows = r.ing.map(([n,q])=>`<tr><td style="padding:4px 0;border-bottom:1px solid var(--border-light);font-size:.82rem;color:var(--muted)">${n}</td><td style="padding:4px 0;border-bottom:1px solid var(--border-light);text-align:right;font-size:.82rem;font-weight:500">${q}</td></tr>`).join('');
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-card">
      <div class="detail-hero">
        <div class="detail-cat">${r.cat}</div>
        <div class="detail-name">${r.name}</div>
        <div class="detail-benefit">${r.benefit}</div>
      </div>
      <div class="macro-strip">
        <div class="macro-cell"><div class="macro-val">${r.kcal}</div><div class="macro-lbl">Kcal</div></div>
        <div class="macro-cell"><div class="macro-val">${r.carb}</div><div class="macro-lbl">Carbs</div></div>
        <div class="macro-cell"><div class="macro-val">${r.prot}</div><div class="macro-lbl">Protein</div></div>
        <div class="macro-cell"><div class="macro-val">${r.fat}</div><div class="macro-lbl">Fat</div></div>
      </div>
      <div class="detail-section">
        <div class="detail-section-title">Ingredients</div>
        <table style="width:100%;border-collapse:collapse"><tbody>${ingRows}</tbody></table>
      </div>
      <div class="detail-section">
        <div class="detail-section-title">Method</div>
        <div class="detail-method">${r.method}</div>
      </div>
    </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

function closeDetail() {
  openDetail = null;
  document.getElementById('recipeListView').classList.remove('hidden');
  document.getElementById('detailView').classList.remove('active');
  document.getElementById('detailView').classList.remove('active');
}

renderAllDays();
renderShop();
renderPrep();
renderFilterRow();
renderRecipeList();
